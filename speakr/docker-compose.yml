# Speakr (https://github.com/murtaza-nasir/speakr, AGPL-3.0) wired to the native
# ASR service on the Mac (asr_server.py) and local Ollama for summaries/chat.
services:
  speakr:
    image: learnedmachine/speakr:${SPEAKR_VERSION:-latest}
    container_name: speakr
    restart: unless-stopped
    ports:
      - "127.0.0.1:8899:8899"
    env_file:
      - .env
    extra_hosts:
      # Docker Desktop provides host.docker.internal itself; on Colima use
      # HOST_ADDRESS=host.lima.internal in .env instead.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/instance:/data/instance
